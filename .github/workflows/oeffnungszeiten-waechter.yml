# Wächter über die Öffnungszeiten des Campusplans.
#
# Täglich (Auftrag 18. Oktober 2026: «Alle Öffnungszeiten aktuell abgleichen!
# … da dürfen wir umsichtig sein»): fragt die Edge Function
# campusplan-ausnahmen frisch ab und prüft, dass jede Quelle gelesen wurde und
# jeder Ort mit `quelle` in apps/campusplan/gaeste.js live gefunden wird
# (python3 tools/oeffnungszeiten-pruefen.py --live). Der Plan liest die
# Zeiten ohnehin bei jedem Aufruf live; der Wächter bemerkt, wenn eine
# Website ihren Aufbau ändert und der Parser nachgezogen werden muss.
#
# Monatlich (am 1., Beschluss 14. September 2026): vergleicht zusätzlich den
# Zeiten-Text der Quellseiten mit dem Stand in docs/oeffnungszeiten-stand/.
#
# Bei einer Lücke eröffnet er ein Issue (Label campusplan) — nur, wenn noch
# keins offen ist. Geändert wird nichts von selbst.
name: Öffnungszeiten-Wächter

on:
  schedule:
    - cron: "17 5 * * *"    # täglich 5.17 Uhr UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live-Abgleich prüfen
        id: live
        run: |
          if python3 tools/oeffnungszeiten-pruefen.py --live; then
            echo "luecke=nein" >> "$GITHUB_OUTPUT"
          else
            echo "luecke=ja" >> "$GITHUB_OUTPUT"
            mv oeffnungszeiten-abweichungen.md live-bericht.md
          fi
      - name: Issue zum Live-Abgleich
        if: steps.live.outputs.luecke == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kopf="Öffnungszeiten: Live-Abgleich lückenhaft"
          if gh issue list --label campusplan --state open --search "$kopf in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue ist schon offen."
          else
            gh issue create --title "$kopf ($(date -u +%Y-%m-%d))" --body-file live-bericht.md --label "campusplan"
          fi
      - name: Quellseiten mit dem Stand vergleichen (am 1. des Monats)
        id: vergleich
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * *'
        run: |
          if [ "$(date -u +%d)" != "01" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if python3 tools/oeffnungszeiten-pruefen.py --pruefen; then
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"
          else
            echo "geaendert=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Issue zum Monatsvergleich
        if: steps.vergleich.outputs.geaendert == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titel="Öffnungszeiten prüfen: Quellseiten haben sich geändert ($(date -u +%Y-%m))"
          gh issue create --title "$titel" --body-file oeffnungszeiten-abweichungen.md --label "campusplan"
