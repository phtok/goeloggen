# Schema von services/folder/schema.sql automatisch anwenden — bei Änderung.
# -----------------------------------------------------------------------------
# Schwesterworkflow zu «Deploy ingest-paperform»/«Deploy ingest-uscreen»: was auf
# main liegt, soll auch laufen. Das Schema ist idempotent (create table/function
# if not exists / or replace) — jeder Lauf ist gefahrlos wiederholbar.
#
# Voraussetzung (schon eingerichtet):
#   Repo-Secret SUPABASE_ACCESS_TOKEN
#   (https://supabase.com/dashboard/account/tokens → «Generate new token»).
name: Deploy folder-archiv schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/folder/schema.sql"
      - ".github/workflows/folder-archiv-schema.yml"

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dagcsnfrlbpxcmdimnrw
    steps:
      - uses: actions/checkout@v4
      - name: Token prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt. Anleitung im Workflow-Kopf." && exit 1
          fi
      - name: Schema anwenden
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          with open("services/folder/schema.sql", "r", encoding="utf-8") as f:
              query = f.read()

          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/query",
              data=json.dumps({"query": query}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8"), file=sys.stderr)
              sys.exit(1)
          PY
