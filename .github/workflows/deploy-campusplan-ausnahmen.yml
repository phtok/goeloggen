# Deploy der Edge Function «campusplan-ausnahmen» (Öffnungszeiten live von
# goetheanum.ch für den Campusplan, services/campusplan/README.md).
# Läuft automatisch, wenn sich die Funktionsquelle auf main ändert, und ist
# von Hand auslösbar (Tab «Actions» → «Deploy campusplan-ausnahmen» →
# «Run workflow»). Braucht das Repo-Secret SUPABASE_ACCESS_TOKEN — dasselbe
# wie beim Deploy des Sortierers (Anleitung dort im Kopf).
#
# Die Funktionsquelle wohnt bei services/…; sie wird in das von der CLI
# erwartete Layout (supabase/functions/<name>/index.ts) kopiert und deployt.
# verify_jwt bleibt aus: öffentlich, ohne Schlüssel, ohne Personendaten.
name: Deploy campusplan-ausnahmen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/campusplan/ausnahmen/index.ts"
      - ".github/workflows/deploy-campusplan-ausnahmen.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dagcsnfrlbpxcmdimnrw
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-CLI bereitstellen
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Token prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt. Anleitung im Kopf von deploy-sortierer.yml." && exit 1
          fi
      - name: Funktion ins CLI-Layout kopieren
        run: |
          mkdir -p supabase/functions/campusplan-ausnahmen
          cp services/campusplan/ausnahmen/index.ts supabase/functions/campusplan-ausnahmen/index.ts
      - name: Deploy
        run: supabase functions deploy campusplan-ausnahmen --project-ref "$PROJECT_REF" --no-verify-jwt
