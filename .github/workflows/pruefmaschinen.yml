# Prüfmaschinen als CI-Gate (Beschluss vom 10. Juli 2026):
# «Automatisch mergen, wenn die Prüfmaschinen grün sind» ist erst durchsetzbar,
# wenn die Maschinen unabhängig vom lokalen Hook auf jedem PR laufen.
# Sprache (typo-check) und Gestalt (ds-lint) blockieren bei Schwere ‹fehler›;
# Hinweise melden, blockieren nicht — wie im Hook.
name: Prüfmaschinen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: typo-check (Sprache, alle Seiten)
        run: python3 tools/typo-check.py --all
      - name: ds-lint (Gestalt, alle Seiten + Score)
        run: python3 tools/ds-lint.py
      - name: check-on-sek (Sektionsfarben – Vordergrund und Varianten mindestens 4.5 zu 1, beide Themes)
        run: python3 tools/check-on-sek.py

  # DS08 · Barrierefreiheit lässt sich nicht lesen, nur messen: ob ein Kontrast
  # trägt und ein Fingerziel gross genug ist, entscheidet sich erst am
  # gerenderten Blatt. axe-core prüft die normativen Kriterien der WCAG 2.2
  # (A und AA) in Chromium. Eigener Job, weil er einen Browser braucht.
  #
  # KEIN TOR, ABER BESCHEID: der Schritt läuft mit --check, darf aber
  # scheitern (continue-on-error). Der Rückstand der Erstmessung ist seit dem
  # 18. 10. 2026 abgetragen (CHANGELOG-a11y.md, D1–D13); der Auftraggeber hat
  # entschieden, dass die Messung trotzdem berichtend bleibt und dafür jedes
  # Mal Bescheid gibt, wenn etwas nicht stimmt: auf einem PR als Kommentar, auf
  # main als Issue (Label barrierefreiheit), das sich bei Grün selbst schliesst.
  # Zum Tor wird sie, indem die Zeile «continue-on-error» verschwindet.
  #
  # Schnell, weil (1) ein PR nur die Seiten misst, die sein Unterschied berühren
  # kann (--seit; der Push auf main misst das ganze Haus), (2) mehrere Fenster
  # zugleich messen (--parallel) und (3) kein Browser geholt wird: der Läufer
  # bringt Google Chrome schon mit. Nur wenn der fehlt, wird Chromium geladen.
  # Gemessen am 7. 10. 2026: chrome-headless-shell startet kalt in 0,2 s statt
  # 7 s, kostet aber 4,2 s Installation je Lauf – netto kein Gewinn, verworfen.
  barrierefreiheit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Node bringt der Läufer mit; fünf Pakete installieren sich ohne Cache in
      # einer Sekunde – setup-node kostete mit Download mehr, als es sparte.
      - name: Pakete und Browser
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          chrome="$(command -v google-chrome || true)"
          if [ -z "$chrome" ]; then
            npx playwright install --with-deps chromium
          else
            echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          fi
      - name: barrierefreiheit (WCAG 2.2 AA)
        id: messung
        continue-on-error: true
        run: |
          set +e
          umfang=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            umfang="--seit origin/${{ github.base_ref }}"
          fi
          node tools/barrierefreiheit.mjs --check --parallel 4 $umfang | tee wcag.txt
          stand=${PIPESTATUS[0]}
          {
            echo '## Barrierefreiheit · WCAG 2.2 AA (DS08)'
            echo '```'
            cat wcag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $stand
      # Bescheid geben (Auftrag 18. 10. 2026): jeder Fund wird gemeldet.
      - name: Bescheid auf dem PR
        if: github.event_name == 'pull_request' && steps.messung.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Barrierefreiheit (DS08): die Messung meldet Verstösse** auf den Seiten, die dieser PR berührt."
            echo
            echo "Lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -n 80 wcag.txt
            echo '```'
          } > bericht.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file bericht.md || true
      - name: Bescheid auf main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kopf="Barrierefreiheit: Verstösse auf main"
          offen="$(gh issue list --label barrierefreiheit --state open --search "$kopf in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "${{ steps.messung.outcome }}" = "failure" ]; then
            {
              echo "Die Messung auf \`main\` (${GITHUB_SHA::7}) meldet Verstösse gegen WCAG 2.2 AA."
              echo
              echo "Lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo '```'
              tail -n 80 wcag.txt
              echo '```'
            } > bericht.md
            if [ -n "$offen" ]; then
              gh issue comment "$offen" --body-file bericht.md
            else
              gh label create barrierefreiheit --color B60205 --description "Funde der Barrierefreiheits-Messung (DS08)" --force >/dev/null 2>&1 || true
              gh issue create --title "$kopf" --label barrierefreiheit --body-file bericht.md
            fi
          elif [ -n "$offen" ]; then
            gh issue close "$offen" --comment "Wieder grün: kein Verstoss mehr auf \`main\` (${GITHUB_SHA::7})."
          fi
