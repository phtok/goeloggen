<!doctype html>
<!-- =============================================================================
     Programmheft · Live-Editor (Skizze)
     Direkt ins Heft schreiben: jedes Feld der vier A5-Seiten ist bearbeitbar,
     Programmpunkte und Pausen per Knopf. Satz wie apps/programmheft/ (G05, G01,
     G25, G03, B01). Farben: zwölf Sektionen + Bereiche + Bühne, mit Namen.
     Papier bleibt weiss, auch im dunklen Modus (# ds-ok).
     ============================================================================= -->
<html lang="de-CH">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Goetheanum Folder erstellen · Goetheanum</title>
<link rel="icon" type="image/svg+xml" href="../../assets/logos/goetheanum-mark-blue.svg" />
<link rel="stylesheet" href="../../design-system/tokens.css" />
<link rel="stylesheet" href="../../design-system/base.css" />
<link rel="stylesheet" href="../../design-system/nav.css" />
<style>
  .hero{padding-block:clamp(28px,5vw,48px) var(--s5)}
  .hero h1{font-family:var(--font);font-weight:var(--w-deutlich);font-size:clamp(28px,4.6vw,44px)}
  .hero .lede{margin-top:var(--s3);color:var(--muted);font-size:var(--t-lede);line-height:1.5;max-width:58ch}

  /* ---------- Werkleiste ---------- */
  .leiste{display:grid;gap:var(--s4);margin-bottom:var(--s6)}
  .leiste .reihe{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
  .leiste .lab{flex:0 0 100%}
  .farbwahl{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .farbwahl button{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s3) 0 var(--s2);
    border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);color:var(--ink);
    font-family:var(--font-text);font-size:var(--t-small);cursor:pointer}
  .farbwahl button .punkt{width:1.5rem;height:1.5rem;border-radius:50%;flex:none}
  .farbwahl button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
  .farbwahl .trenner{flex:0 0 100%;height:0}
  .motive{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .motive button{width:var(--tap);height:var(--tap);padding:0;border:.15rem solid transparent;border-radius:var(--r-control);background:var(--soft) center/cover no-repeat;cursor:pointer}
  .motive button[aria-pressed="true"]{border-color:var(--gold-deep);outline:.15rem solid var(--gold-deep);outline-offset:.1rem}
  .hinweis{font-size:var(--t-small);color:var(--muted);margin:0}

  /* ---------- Das Heft ---------- */
  .blaetter{display:flex;flex-wrap:wrap;gap:var(--s6);justify-content:center;padding-bottom:var(--s8)}
  .seite{width:148mm;height:210mm;background:#fff;color:#23272b; /* # ds-ok Papier */
    position:relative;overflow:hidden;box-shadow:var(--shadow-card);border:1px solid var(--line);
    font-family:var(--font-display);font-weight:var(--w-klar);display:flex;flex-direction:column}
  .blaetter{--acc:var(--bereich);--on-acc:var(--on-accent);--ort:color-mix(in srgb,var(--acc) 72%,#000);--kopf:color-mix(in srgb,var(--acc) 80%,#000)} /* # ds-ok Tinte */

  [contenteditable]{outline:none;border-radius:1mm;cursor:text;min-width:1em}
  [contenteditable]:hover{box-shadow:0 0 0 .4mm color-mix(in srgb,currentColor 30%,transparent)} /* # ds-ok Bearbeitungsrahmen */
  [contenteditable]:focus{box-shadow:0 0 0 .6mm var(--gold)}
  [contenteditable]:empty::before{content:attr(data-leer);opacity:.45}

  .titel .feld{background:var(--acc);color:var(--on-acc);flex:0 0 60%;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;padding:14mm 12mm 18mm;gap:7mm;position:relative}
  .titel .feld{z-index:1;margin-bottom:-14mm;padding-bottom:26mm}
  .kante-schraege .feld{clip-path:polygon(0 0,100% 0,100% calc(100% - 14mm),0 100%)}
  .kante-trapez .feld{clip-path:polygon(0 0,100% 0,100% calc(100% - 14mm),78% 100%,22% 100%,0 calc(100% - 14mm))}
  .kante-gerade .feld{margin-bottom:0;padding-bottom:18mm}
  .titel h2{font-weight:var(--w-deutlich);font-size:34pt;line-height:1.05;margin:auto 0 0;text-wrap:balance}
  .titel .wann{font-weight:var(--w-deutlich);font-size:15pt;line-height:1.3;margin:0;white-space:pre-line;font-variant-numeric:lining-nums}
  .titel .marke{height:6.5mm;margin:6mm 0 auto;filter:var(--marke-filter,brightness(0) invert(1))}
  .titel .bild{flex:1;background:var(--soft) center/cover no-repeat;position:relative}
  .titel .credit{position:absolute;right:4mm;bottom:3mm;font-family:var(--font-text);font-size:6.5pt;color:#fff; /* # ds-ok Druck-Credit auf Foto */
    text-shadow:0 0 2mm rgba(0,0,0,.6)} /* # ds-ok */

  .prog{padding:13mm 9mm 10mm}
  .prog h3,.info h3{font-weight:var(--w-deutlich);font-size:22pt;color:var(--kopf);margin:0 0 6mm 2mm}
  .zeilen{display:grid;--pad:3mm}
  .z{display:grid;grid-template-columns:31mm 1fr;gap:3mm;padding:var(--pad) 3mm;border-bottom:.3mm solid rgba(0,0,0,.12); /* # ds-ok Haarlinie */
    font-family:var(--font-text);font-size:var(--grad,12pt);line-height:1.4;position:relative}
  .z.pause{background:color-mix(in srgb,var(--acc) 12%,#fff)} /* # ds-ok Tönung */
  .z .zeit{font-weight:700;font-variant-numeric:tabular-nums lining-nums}
  .z b,.z strong{font-weight:700}
  /* Vergleich: Programmtitel als Stimme – Hausschrift Klar, Betonung Laut; Zeit und Ort bleiben Source */
  .stimme .z .titeltext{font-family:var(--font-display);font-weight:var(--w-klar)}
  .stimme .z .titeltext b{font-weight:var(--w-laut)}
  .z .ort{color:var(--ort);display:inline-flex;align-items:baseline;gap:.15em;white-space:nowrap}
  .z .ort svg{width:.8em;height:.8em;fill:currentColor;flex:none;align-self:center}

  /* Werkzeuge an der Zeile: erscheinen beim Bearbeiten, nie im Druck */
  .zwerk{position:absolute;right:1mm;top:50%;transform:translateY(-50%);display:none;gap:1mm;z-index:2}
  .z:hover .zwerk,.z:focus-within .zwerk{display:flex}
  .zwerk button,.plus button{font-family:var(--font-text);font-size:var(--t-micro);min-height:var(--tap);min-width:var(--tap);
    padding:0 var(--s2);border-radius:var(--r-control);border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:.3em}
  .zwerk svg,.plus svg{width:1.1rem;height:1.1rem;stroke:currentColor;fill:none;stroke-width:2}
  .plus{display:flex;gap:var(--s2);margin-top:3mm;flex-wrap:wrap}
  .plus button{border-style:dashed}

  .info{padding:13mm 11mm 10mm;gap:5mm}
  .info h3{margin:0}
  .info .plan{flex:1 1 0;min-height:60mm;display:flex;justify-content:center}
  .karte{position:relative;height:100%;max-width:100%;aspect-ratio:192/210}
  .karte img{width:100%;height:100%;display:block}
  .mk{position:absolute;transform:translate(-50%,-50%);width:6.5mm;height:6.5mm;border-radius:50%;border:.5mm solid #fff; /* # ds-ok Papier */
    background:var(--gold-deep);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-text);
    font-size:10pt;font-weight:700;font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;padding:0}
  .mk:active{cursor:grabbing}
  .offen{font-family:var(--font-text);font-size:var(--t-small);display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
  .offen .mk{position:static;transform:none}
  .z .ort .nr{font-weight:700;font-variant-numeric:tabular-nums}
  .legende{columns:2;column-gap:6mm;font-family:var(--font-text);font-size:11pt;line-height:1.5;margin:0;padding:0;list-style:none}
  .legende li{display:flex;gap:2mm;break-inside:avoid;margin-bottom:1mm;align-items:baseline}
  .legende .n{flex:0 0 6mm;height:6mm;border-radius:50%;background:var(--gold-deep);color:var(--on-accent);
    display:grid;place-items:center;font-size:9pt;font-weight:700;font-variant-numeric:tabular-nums}
  .info .fuss{font-family:var(--font-text);font-size:9pt;line-height:1.45;display:flex;justify-content:space-between;align-items:end;gap:4mm}
  .info .fuss .kontakt{white-space:pre-line}
  .info .fuss img{height:5mm}
  .ueberlauf{outline:1mm solid var(--gold);outline-offset:-1mm}

  @media print{
    @page{size:148mm 210mm;margin:0}
    body>*:not(main),.hero,.leiste,.zwerk,.plus,.offen{display:none!important}
    main.wrap{max-width:none;padding:0;margin:0}
    .blaetter{display:block;padding:0}
    .ueberlauf{outline:0}
    [contenteditable]{box-shadow:none!important}
    [contenteditable]:empty::before{content:none}
    .seite{box-shadow:none;border:0;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  }
</style>
</head>
<body>
<script src="../karten-generator/orte.js"></script>
<script src="../karten-generator/vendor/jspdf.umd.min.js"></script>
<script src="../karten-generator/vendor/svg2pdf.umd.min.js"></script>
<script src="../../design-system/nav.js" data-root="../../" data-variant="werkzeug"></script>

<main class="wrap">
  <section class="hero">
    <span class="kicker">Veranstaltungen · Skizze</span>
    <h1>Goetheanum Folder erstellen</h1>
  </section>

  <div class="leiste card soft">
    <div class="reihe"><span class="lab">Farbe</span><div class="farbwahl" id="farbwahl" role="group" aria-label="Farbe"></div></div>
    <div class="reihe"><span class="lab">Titelbild</span><div class="motive" id="motive"></div>
      <button class="btn" type="button" id="bild-waehlen">Eigenes Bild</button><input type="file" id="f-bild" accept="image/*" hidden /></div>
    <div class="reihe"><span class="lab">Kante</span><div class="farbwahl" id="kanten" role="group" aria-label="Kante über dem Titelbild"></div></div>
    <div class="reihe"><span class="lab">Programmtitel</span><div class="farbwahl" id="stimmen" role="group" aria-label="Schrift der Programmtitel"></div></div>
    <div class="reihe">
      <button class="btn primary" type="button" id="pdf" data-druck="0">PDF für den Versand</button>
      <button class="btn" type="button" id="pdf-druck" data-druck="1">PDF für die Druckerei</button>
      <button class="btn" type="button" id="idml">Für InDesign (IDML)</button>
      <button class="btn" type="button" id="zuruecksetzen">Beispiel wiederherstellen</button>
      <p class="hinweis">Fett: Text markieren und Strg+B. Alles bleibt in diesem Browser gespeichert.</p>
    </div>
  </div>

  <div class="blaetter" id="blaetter"></div>
</main>

<footer class="ds-footer"><div class="wrap frow"><span><strong>Goetheanum Grafik</strong></span><span><a href="./">Programmheft mit Formular</a></span></div></footer>

<script>
// Zwölf Sektionen, dann die zwei Bereichsfarben. Name = Beschriftung der Wahl.
const FARBEN=[
  ["sek-aas","Allgemeine Anthroposophische Sektion"],["sek-ps","Pädagogische Sektion"],["sek-ms","Medizinische Sektion"],
  ["sek-nws","Naturwissenschaftliche Sektion"],["sek-lws","Sektion für Landwirtschaft"],["sek-sbk","Sektion für Bildende Künste"],
  ["sek-ssw","Sektion für Schöne Wissenschaften"],["sek-szw","Sektion für Sozialwissenschaft"],["sek-js","Jugendsektion"],
  ["sek-srmk","Sektion für Redende und Musizierende Künste"],["sek-mas","Mathematisch-Astronomische Sektion"],
  ["sek-hpise","Sektion für Heilpädagogik und inklusive soziale Entwicklung"],
  null,
  ["bereich","Bereiche"],["bereich-buehne","Bühne"]];
const MOTIVE=[["titelbild-goetheanum.jpg","Fenster hinter Lavendel","Foto: Goetheanum"],["titel-herbst.jpg","Goetheanum im Herbst","Foto: Goetheanum / Xue Li"],
  ["titel-campus.jpg","Westansicht, Campus-Fest","Foto: Goetheanum / Xue Li"],["titel-westtreppe.jpg","Westtreppenhaus","Foto: Goetheanum / Xue Li"],
  ["titel-luftbild.jpg","Luftbild des Campus","Foto: Goetheanum / Xue Li"],["titel-glashaus.jpg","Glashaus","Foto: Goetheanum / Xue Li"]];

// Bekannte Orte auf dem Standardplan, in Prozent der Karte. Unbekannte zieht man selbst auf die Karte.
// Orte kommen aus dem Kartenwerkzeug (orte.js, mm auf dem A4-quer-Blatt).
// Der Standardplan zeigt davon den Ausschnitt x 105–297, y 0–210.
const AUSSCHNITT={x:105,y:0,b:192,h:210};
function kartenOrt(name){
  const n=(name||"").trim().toLowerCase();if(!n)return null;
  const o=ORTE.find(o=>o.label.de.toLowerCase()===n)||ORTE.find(o=>o.label.de.toLowerCase().split(" · ")[0]===n);
  const p=o&&o.positionen[0];if(!p)return null;
  const x=(p[0]-AUSSCHNITT.x)/AUSSCHNITT.b*100,y=(p[1]-AUSSCHNITT.y)/AUSSCHNITT.h*100;
  return x<2||x>98||y<2||y>98?null:[Math.round(x*10)/10,Math.round(y*10)/10];
}
const lage=o=>S.orte[o]||kartenOrt(o);
const KANTEN=[["schraege","Schräge wie im Logo"],["trapez","Trapez wie der Bau"],["gerade","Gerade"]];
const BEISPIEL={farbe:"bereich",bild:MOTIVE[0][0],credit:"Foto: Goetheanum",
  titel:"Offener Tag am Goetheanum",wann:"Samstag, 17. Oktober 2026\n10–16.30 Uhr",
  seiten:[[
    {zeit:"09.30–10.00",text:"Ankommen, Kaffee und Tee",ort:"Foyer",pause:true},
    {zeit:"10.00–10.15",text:"Musikalische Eröffnung",ort:"Grosser Saal"},
    {zeit:"10.15–10.40",text:"Begrüssung und Einführung – Vorname Name",ort:"Grosser Saal"},
    {zeit:"10.40–11.10",text:"<b>Bühne</b> – Einblick in die Probenarbeit",ort:"Grosser Saal"},
    {zeit:"11.10–11.40",text:"Pause",ort:"Foyer",pause:true},
    {zeit:"11.40–12.20",text:"<b>Forschung</b> – Vorname Name; Vorname Name",ort:"Grundsteinsaal"},
    {zeit:"12.20–13.00",text:"<b>Kunst</b> – Führung durch das Haus",ort:"Haupteingang"}
  ],[
    {zeit:"13.00–14.00",text:"Mittagessen",ort:"Speisehaus",pause:true},
    {zeit:"14.00–15.00",text:"<b>Garten</b> – Rundgang mit Vorname Name",ort:"Glashaus"},
    {zeit:"15.00–15.45",text:"Gespräch im Plenum",ort:"Grosser Saal"},
    {zeit:"16.00–16.30",text:"Musikalischer Abschluss",ort:"Grosser Saal"},
    {zeit:"ab 16.30",text:"Ausklang und Getränke",ort:"Foyer",pause:true}
  ]],
  info:"Campus",plan:"lageplan-standard.svg?v=3",kante:"schraege",extra:[],orte:{},
  kontakt:"Goetheanum, Rüttiweg 45, 4143 Dornach\nwww.goetheanum.ch"};

const SPEICHER="goe-programmheft-live-1";
let S;try{S=JSON.parse(localStorage.getItem(SPEICHER))}catch(e){}
if(!S)S=structuredClone(BEISPIEL);
// Ältere Stände nachziehen
if(!S.orte){S.extra=[];delete S.leg;if(S.info==="Lageplan")S.info="Campus";S.plan=BEISPIEL.plan}
if(S.v!==2){S.v=2;S.orte={};delete S.unter;delete S.stich}
if(!S.kante)S.kante="schraege";
const qk=new URLSearchParams(location.search).get("kante");if(qk)S.kante=qk;
// Legende = Orte aus dem Programm (in Reihenfolge) + eigene Zusätze
function orte(){const l=[];S.seiten.flat().map(z=>(z.ort||"").trim()).concat(S.extra.map(x=>x.trim())).forEach(o=>{if(o&&!l.includes(o))l.push(o)});return l}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Zeitspanne mit Halbgeviertstrich; keine unnötigen Nullen: 17 Uhr, 9.30, nie 17.00 oder 09.30.
const strich=s=>s.replace(/(\d)\s*[-–]\s*(\d)/g,"$1–$2")
  .replace(/\b(\d{1,2})[.:]00\b/g,"$1").replace(/\b0(\d)(?=[.:]\d\d|\b(?!\.\s?\w))/g,"$1").replace(/\b(\d{1,2})[:](\d\d)\b/g,"$1.$2");
S.wann=strich(S.wann);S.seiten.forEach(L=>L.forEach(z=>z.zeit=strich(z.zeit)));

// Nur Text und Fett überleben das Bearbeiten.
function rein(html){
  const d=document.createElement("div");d.innerHTML=html;
  const geh=n=>[...n.childNodes].map(c=>c.nodeType===3?esc(c.textContent)
    :/^(B|STRONG)$/.test(c.nodeName)?`<b>${geh(c)}</b>`:c.nodeName==="BR"?" ":geh(c)).join("");
  return geh(d).replace(/<b>\s*<\/b>/g,"");
}

const I={
  pin:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  weg:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  tasse:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"/></svg>',
  hoch:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'};

// Ein bearbeitbares Feld: pfad zeigt in den Zustand, z. B. "seiten.0.3.text".
const ed=(pfad,wert,tag="span",kl="",leer="",fett=false)=>
  `<${tag} class="${kl}" contenteditable="${fett?"true":"plaintext-only"}" spellcheck="true" data-pfad="${pfad}" data-leer="${esc(leer)}">${fett?wert:esc(wert)}</${tag}>`;

let NR=[];const nrVon=o=>{const k=NR.indexOf((o||"").trim());return k<0?I.pin:`<span class="nr">${k+1}</span>`};
function zeile(z,s,i){
  return `<div class="z${z.pause?" pause":""}">
    ${ed(`seiten.${s}.${i}.zeit`,z.zeit,"span","zeit","Zeit")}
    <span>${ed(`seiten.${s}.${i}.text`,z.text,"span","titeltext","Programmpunkt",true)} <span class="ort">${nrVon(z.ort)}${ed(`seiten.${s}.${i}.ort`,z.ort,"span","","Ort")}</span></span>
    <span class="zwerk">
      ${i>0||s>0?`<button type="button" data-tat="hoch" data-s="${s}" data-i="${i}" aria-label="Nach oben" title="Nach oben">${I.hoch}</button>`:""}
      <button type="button" data-tat="pause" data-s="${s}" data-i="${i}" aria-pressed="${!!z.pause}" title="Als Pause tönen">${I.tasse}Pause</button>
      <button type="button" data-tat="weg" data-s="${s}" data-i="${i}" aria-label="Programmpunkt entfernen" title="Entfernen">${I.weg}</button>
    </span></div>`;
}
const plus=s=>`<div class="plus">
  <button type="button" data-tat="neu" data-s="${s}">${I.plus}Programmpunkt</button>
  <button type="button" data-tat="neupause" data-s="${s}">${I.plus}Pause</button></div>`;

function kontrast(hex){ // Weiss gegen eine Farbe, WCAG-Formel
  const c=document.createElement("canvas").getContext("2d");c.fillStyle=hex;const h=c.fillStyle;
  if(!/^#/.test(h))return 21;
  const L=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);
  return 1.05/(.2126*L[0]+.7152*L[1]+.0722*L[2]+.05);
}
// Karte in der gewählten Farbe: die vier Blaustufen des Plans werden zu Stufen
// der Sektionsfarbe (Grund, Wege-Rand, Bauten gemischt mit Weiss; Goetheanum voll).
let KARTE_URL=null,KARTE_FARBE=null,KARTE_SVG=null;
const KARTE_STUFEN={"#edf5fa":7,"#8abfe5":45,"#5298cc":68,"#0067b2":100};
async function karteFaerben(){
  const f=S.farbe;if(KARTE_FARBE===f)return;KARTE_FARBE=f;
  KARTE_SVG??=await (await fetch(S.plan)).text();
  let t=KARTE_SVG;
  if(f!=="bereich"){const basis=aufloesen(`var(--${f})`);
    for(const [alt,anteil] of Object.entries(KARTE_STUFEN))
      t=t.split(alt).join(anteil===100?basis:aufloesen(`color-mix(in srgb,${basis} ${anteil}%,#fff)`));} // # ds-ok Kartenstufe
  if(KARTE_URL)URL.revokeObjectURL(KARTE_URL);
  KARTE_URL=URL.createObjectURL(new Blob([t],{type:"image/svg+xml"}));
  const img=document.querySelector("#karte img");if(img)img.src=KARTE_URL;
}
function bauen(){
  const f=S.farbe, logo="../../assets/logos/goetheanum-logo.svg";
  const b=$("blaetter");NR=orte();b.classList.toggle("stimme",!!S.stimme);
  // Schrift und Logo auf der Fläche immer weiss (B01). Trägt Weiss auf der Grundfarbe
// nicht (unter 4.5:1), steht die abgedunkelte Variante des Farbsystems (-dunkel).
  const cs=getComputedStyle(document.documentElement),t=n=>cs.getPropertyValue(`--${n}`).trim();
  const fl=t(f+"-dunkel")&&kontrast(t(f))<4.5?f+"-dunkel":f;
  b.style.setProperty("--acc",`var(--${fl})`);
  if(t(f+"-ink")){b.style.setProperty("--ort",`var(--${f}-ink)`);b.style.setProperty("--kopf",`var(--${f}-ink)`)}
  b.innerHTML=`
  <article class="seite titel kante-${S.kante}" aria-label="Seite 1, Titel">
    <div class="feld">
      <img class="marke" src="${logo}" alt="Goetheanum" />
      ${ed("titel",S.titel,"h2","","Titel")}
      ${ed("wann",S.wann,"p","wann","Datum und Zeit")}
    </div>
    <div class="bild" style="background-image:url('${S.bild}')">${ed("credit",S.credit,"span","credit","Bildnachweis")}</div>
  </article>
  ${[0,1].map(s=>`<article class="seite prog" aria-label="Seite ${s+2}, Programm">
    ${s===0?"<h3>Programm</h3>":""}<div class="zeilen">${S.seiten[s].map((z,i)=>zeile(z,s,i)).join("")}</div>${plus(s)}
  </article>`).join("")}
  <article class="seite info" aria-label="Seite 4, Campus">
    ${ed("info",S.info,"h3","","Überschrift")}
    <div class="plan"><div class="karte" id="karte"><img src="${KARTE_URL||S.plan}" alt="Plan des Campus" />
      ${NR.map((o,k)=>lage(o)?`<button type="button" class="mk" data-ort="${esc(o)}" style="left:${lage(o)[0]}%;top:${lage(o)[1]}%" title="${esc(o)} – ziehen zum Verschieben">${k+1}</button>`:"").join("")}</div></div>
    <ol class="legende">${NR.map((o,k)=>`<li><span class="n">${k+1}</span>${esc(o)}</li>`).join("")}</ol>
    ${NR.some(o=>!lage(o))?`<div class="offen">Noch nicht auf der Karte – auf den Plan ziehen:
      ${NR.map((o,k)=>lage(o)?"":`<button type="button" class="mk" data-ort="${esc(o)}" title="${esc(o)}">${k+1}</button> ${esc(o)}`).join(" ")}</div>`:""}
    <div class="plus">${S.extra.map((x,k)=>ed(`extra.${k}`,x,"span","","Ort")).join(" ")}<button type="button" data-tat="neuleg">${I.plus}Weiterer Ort</button></div>
    <div class="fuss">${ed("kontakt",S.kontakt,"span","kontakt","Kontakt")}<img src="${logo}" alt="Goetheanum" /></div>
  </article>`;
  einpassen();markieren();sichern();karteFaerben();
}

// Programmseiten füllen: Grad wächst bis 14 pt, Zeilenabstand je Seite bis unten.
function einpassen(){
  const seiten=[...document.querySelectorAll(".seite.prog")];
  const passt=()=>seiten.every(s=>s.scrollHeight<=s.clientHeight+1);
  const setzen=(g,pad)=>seiten.forEach(s=>{s.style.setProperty("--grad",g+"pt");s.querySelector(".zeilen").style.setProperty("--pad",pad+"mm")});
  for(let g=14;g>10;g-=.5){setzen(g,3);if(passt())break}
  seiten.forEach(s=>{const z=s.querySelector(".zeilen");
    for(let pad=3.5;pad<=7;pad+=.5){z.style.setProperty("--pad",pad+"mm");
      if(s.scrollHeight>s.clientHeight+1){z.style.setProperty("--pad",(pad-.5)+"mm");break}}});
  seiten.forEach(s=>s.classList.toggle("ueberlauf",s.scrollHeight>s.clientHeight+1));
}

function setzen(pfad,wert){const k=pfad.split(".");let o=S;k.slice(0,-1).forEach(x=>o=o[x]);o[k.at(-1)]=wert}
function sichern(){try{localStorage.setItem(SPEICHER,JSON.stringify(S))}catch(e){}}

const B=$("blaetter");
B.addEventListener("input",e=>{const el=e.target.closest("[data-pfad]");if(!el)return;
  setzen(el.dataset.pfad,el.isContentEditable&&el.getAttribute("contenteditable")==="true"?rein(el.innerHTML):el.innerText);
  einpassen();sichern()});
B.addEventListener("focusout",e=>{const el=e.target.closest("[data-pfad]");
  if(el&&/ort$|^extra\./.test(el.dataset.pfad)&&!B.contains(e.relatedTarget)){setTimeout(bauen);return}
  if(el&&/zeit$|^wann$/.test(el.dataset.pfad)){const v=strich(el.innerText);if(v!==el.innerText){el.innerText=v;setzen(el.dataset.pfad,v);sichern()}}});
B.addEventListener("keydown",e=>{const el=e.target.closest("[data-pfad]");if(!el||e.key!=="Enter")return;
  if(/^(wann|kontakt)$/.test(el.dataset.pfad))return; // mehrzeilig erlaubt
  e.preventDefault();
  const m=el.dataset.pfad.match(/^seiten\.(\d)\.(\d+)\./);
  if(m){const s=+m[1],i=+m[2];S.seiten[s].splice(i+1,0,{zeit:"",text:"",ort:""});bauen();fokus(`seiten.${s}.${i+1}.zeit`)}
  else el.blur()});
B.addEventListener("paste",e=>{if(!e.target.closest("[data-pfad]"))return;e.preventDefault();
  document.execCommand("insertText",false,(e.clipboardData.getData("text/plain")||"").replace(/\s*\n\s*/g," "))});
B.addEventListener("click",e=>{const t=e.target.closest("[data-tat]");if(!t)return;
  const s=+t.dataset.s,i=+t.dataset.i,L=S.seiten[s];
  switch(t.dataset.tat){
    case "neu":L.push({zeit:"",text:"",ort:""});bauen();fokus(`seiten.${s}.${L.length-1}.zeit`);return;
    case "neupause":L.push({zeit:"",text:"Pause",ort:"Foyer",pause:true});bauen();fokus(`seiten.${s}.${L.length-1}.zeit`);return;
    case "neuleg":S.extra.push("");bauen();fokus(`extra.${S.extra.length-1}`);return;
    case "pause":L[i].pause=!L[i].pause;break;
    case "weg":L.splice(i,1);break;
    case "hoch":if(i>0)[L[i-1],L[i]]=[L[i],L[i-1]];else S.seiten[s-1].push(L.shift());break;
  }bauen()});
function fokus(p){const el=B.querySelector(`[data-pfad="${p}"]`);if(el){el.focus()}}

// Farbwahl mit Namen
FARBEN.forEach(x=>{if(!x){const t=document.createElement("span");t.className="trenner";$("farbwahl").append(t);return}
  const [k,n]=x,b=document.createElement("button");b.type="button";b.dataset.k=k;
  b.innerHTML=`<span class="punkt" style="background:var(--${k})"></span>${esc(n)}`;
  b.onclick=()=>{S.farbe=k;bauen()};$("farbwahl").append(b)});
MOTIVE.forEach(([f,n,c])=>{const b=document.createElement("button");b.type="button";b.dataset.f=f;
  b.style.backgroundImage=`url('${f}')`;b.title=n;b.setAttribute("aria-label","Titelbild: "+n);
  b.onclick=()=>{S.bild=f;S.credit=c;bauen()};$("motive").append(b)});
function markieren(){
  document.querySelectorAll("#farbwahl button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===S.farbe));
  document.querySelectorAll("#stimmen button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===String(!!S.stimme)));
  document.querySelectorAll("#kanten button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===S.kante));
  document.querySelectorAll("#motive button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===S.bild));
}
[[false,"Source Sans"],[true,"Hausschrift"]].forEach(([v,n])=>{const b=document.createElement("button");b.type="button";b.dataset.v=v;b.textContent=n;
  b.onclick=()=>{S.stimme=v;bauen()};$("stimmen").append(b)});
KANTEN.forEach(([k,n])=>{const b=document.createElement("button");b.type="button";b.dataset.k=k;b.textContent=n;
  b.onclick=()=>{S.kante=k;bauen()};$("kanten").append(b)});
// Ortsnummern auf die Karte ziehen
B.addEventListener("pointerdown",e=>{const m=e.target.closest(".mk");if(!m)return;e.preventDefault();
  const o=m.dataset.ort,k=$("karte");let pos=null;
  const zug=ev=>{const r=k.getBoundingClientRect();
    pos=[(ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100].map(v=>Math.round(Math.min(98,Math.max(2,v))*10)/10);
    Object.assign(m.style,{position:"absolute",transform:"translate(-50%,-50%)",left:`${ev.clientX-m.offsetParent.getBoundingClientRect().left}px`,top:`${ev.clientY-m.offsetParent.getBoundingClientRect().top}px`})};
  const los=()=>{removeEventListener("pointermove",zug);removeEventListener("pointerup",los);
    if(pos){const r=k.getBoundingClientRect();S.orte[o]=pos;}bauen()};
  addEventListener("pointermove",zug);addEventListener("pointerup",los)});
$("bild-waehlen").onclick=()=>$("f-bild").click();
$("f-bild").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{S.bild=r.result;S.credit="";bauen()};r.readAsDataURL(f)});
// ---------- IDML: InDesign-Paket mit Bildern im Ordner «Links»
const laden=src=>new Promise((ok,nein)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=nein;i.src=src});
const alsBytes=c=>new Promise(ok=>c.toBlob(async b=>ok(new Uint8Array(await b.arrayBuffer())),"image/png"));
const hex=farbe=>{const c=document.createElement("canvas").getContext("2d");c.fillStyle=farbe;return c.fillStyle};
function aufloesen(v){ // beliebige CSS-Farbe (auch color-mix) → #rrggbb, über ein Pixel gelesen
  const d=document.createElement("i");d.style.color=v;B.append(d);const c=getComputedStyle(d).color;d.remove();
  const g=document.createElement("canvas").getContext("2d",{willReadFrequently:true});g.fillStyle=c;g.fillRect(0,0,1,1);
  return "#"+[...g.getImageData(0,0,1,1).data].slice(0,3).map(v=>v.toString(16).padStart(2,"0")).join("")}
async function logoPng(weiss){
  const i=await laden("../../assets/logos/goetheanum-logo.svg"),k=6;const c=document.createElement("canvas");
  c.width=i.naturalWidth*k;c.height=i.naturalHeight*k;const g=c.getContext("2d");g.drawImage(i,0,0,c.width,c.height);
  if(weiss){g.globalCompositeOperation="source-in";g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height)} // # ds-ok Druck-Logo
  return {name:weiss?"logo-weiss.png":"logo.png",bytes:await alsBytes(c),b:c.width,h:c.height}}
async function planPng(){
  const i=await laden(KARTE_URL||S.plan),c=document.createElement("canvas");c.width=2400;c.height=Math.round(2400*210/192);
  const g=c.getContext("2d");g.drawImage(i,0,0,c.width,c.height);const r=c.width*6.5/126/2; // Kreis wie im Heft
  await document.fonts.load("700 20px 'Source Sans 3'");
  NR.forEach((o,k)=>{const p=lage(o);if(!p)return;const px=p[0]/100*c.width,py=p[1]/100*c.height;
    g.beginPath();g.arc(px,py,r,0,7);g.fillStyle=hex(getComputedStyle(B).getPropertyValue("--gold-deep"));g.fill();
    g.lineWidth=r*.16;g.strokeStyle="#fff";g.stroke(); // # ds-ok Druck
    g.fillStyle="#fff";g.font=`700 ${r*1.05}px 'Source Sans 3',sans-serif`;g.textAlign="center";g.textBaseline="middle";g.fillText(k+1,px,py+r*.05)}); // # ds-ok Druck
  return {name:"campus.png",bytes:await alsBytes(c),b:c.width,h:c.height}}
async function titelBild(){
  const bytes=new Uint8Array(await (await fetch(S.bild)).arrayBuffer()),i=await laden(S.bild);
  const png=bytes[0]===0x89;return {name:png?"titelbild.png":"titelbild.jpg",bytes,b:i.naturalWidth,h:i.naturalHeight}}
$("idml").onclick=async e=>{const k=e.currentTarget,alt=k.textContent;k.disabled=true;k.textContent="Wird gepackt …";
  try{
    const {baueIdml}=await import("./idml.js");
    const f=S.farbe,name=(FARBEN.find(x=>x&&x[0]===f)||[,f])[1];
    const farben={name,akzent:aufloesen("var(--acc)"),ort:aufloesen("var(--ort)"),
      pause:aufloesen("color-mix(in srgb,var(--acc) 12%,#fff)"),gold:aufloesen("var(--gold-deep)")}; // # ds-ok Tönung
    const bilder={titel:await titelBild(),plan:await planPng(),logo:await logoPng(true),logoBlau:await logoPng(false)};
    const zip=await baueIdml(S,farben,bilder,NR);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([zip],{type:"application/zip"}));
    a.download="Programmheft-InDesign.zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(err){console.error(err);k.textContent="Export fehlgeschlagen";setTimeout(()=>k.textContent=alt,3000);return}
  finally{k.disabled=false}k.textContent=alt};
// ---------- PDF: direkt geschrieben wie im Campusplan, kein Druckdialog
// Versand: 150 ppi, stärker komprimiert. Druckerei: 300 ppi, Bild und Plan bis in den Beschnitt.
async function zuschnitt(src,bmm,hmm,ppi,q){ // Titelbild wie object-fit: cover
  const i=await laden(src),c=document.createElement("canvas");c.width=Math.round(bmm/25.4*ppi);c.height=Math.round(hmm/25.4*ppi);
  const s=Math.max(c.width/i.naturalWidth,c.height/i.naturalHeight),w=i.naturalWidth*s,h=i.naturalHeight*s;
  c.getContext("2d").drawImage(i,(c.width-w)/2,(c.height-h)/2,w,h);return {url:c.toDataURL("image/jpeg",q)}}
async function planOhneNummern(druck){
  const i=await laden(KARTE_URL||S.plan),c=document.createElement("canvas"),w=druck?2400:1000;c.width=w;c.height=Math.round(w*210/192);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0,c.width,c.height); // # ds-ok Papier
  return {url:druck?c.toDataURL("image/png"):c.toDataURL("image/jpeg",.8)}}
const pdfBauen=async e=>{const k=e.currentTarget,alt=k.textContent,druck=k.dataset.druck==="1";k.disabled=true;k.textContent="PDF wird gebaut …";
  try{
    const {bauePdf}=await import("./pdf.js");
    const f={akzent:aufloesen("var(--acc)"),ort:aufloesen("var(--ort)"),kopf:aufloesen("var(--kopf)"),tinte:"#23272b", // # ds-ok Tinte
      pause:aufloesen("color-mix(in srgb,var(--acc) 12%,#fff)"),linie:"#e0e0e0",gold:aufloesen("var(--gold-deep)")}; // # ds-ok Druck
    const grad=parseFloat(document.querySelector(".seite.prog").style.getPropertyValue("--grad"))||12;
    const logoSvg=await (await fetch("../../assets/logos/goetheanum-logo.svg")).text();
    const titel=druck?await zuschnitt(S.bild,154,103,300,.95):await zuschnitt(S.bild,148,100,150,.78);
    const doc=await bauePdf(S,f,{titel,plan:await planOhneNummern(druck)},NR,lage,grad,logoSvg,druck);
    const name=(S.titel||"programmheft").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    doc.save(`${name||"programmheft"}-a5-${druck?"druck-3mm":"versand"}.pdf`);
  }catch(err){console.error(err);k.textContent="PDF fehlgeschlagen";setTimeout(()=>k.textContent=alt,3000);return}
  finally{k.disabled=false}k.textContent=alt};
$("pdf").onclick=pdfBauen;$("pdf-druck").onclick=pdfBauen;
$("zuruecksetzen").onclick=()=>{S=structuredClone(BEISPIEL);bauen()};

bauen();
window.addEventListener("resize",einpassen);
</script>
